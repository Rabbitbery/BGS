var L=["ক","খ","গ","ঘ"],A=[],cur=0,t0,iv;
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function $(i){return document.getElementById(i)}
function begin(){
A=Q.map(function(){return -1});cur=0;
$("start").className="hide";$("exam").className="";$("res").className="hide";
t0=Date.now();clearInterval(iv);
iv=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);$("tm").textContent=bn(("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2))},1000);
show()}
function show(){
var q=Q[cur],h='<div class="c"><div class="q"><span class="n">'+bn(cur+1)+'</span><div>'+q[0]+'</div></div>';
q[1].forEach(function(o,j){h+='<div class="opt'+(A[cur]==j?" s":"")+'" onclick="pick('+j+')"><span class="lt">'+L[j]+'</span><span>'+o+'</span></div>'});
$("qc").innerHTML=h+'</div>';
var d="";Q.forEach(function(_,i){d+='<div class="dot'+(i==cur?" c":A[i]>=0?" d":"")+'" onclick="cur='+i+';show()">'+bn(i+1)+'</div>'});
$("dots").innerHTML=d;
var n=A.filter(function(a){return a>=0}).length;
$("prog").textContent=bn(n)+"/২০ উত্তর দেওয়া হয়েছে";$("pf").style.width=n*5+"%";
$("pv").disabled=cur==0;$("sb").disabled=n<1;$("nx").textContent=cur==19?"জমা দাও ✅":"পরের →";
var c=$("dots").children[cur];if(c)c.scrollIntoView({block:"nearest",inline:"center"});
window.scrollTo(0,0)}
function pick(j){A[cur]=j;show()}
function go(d){if(d>0&&cur==19){submitExam();return}cur=Math.max(0,Math.min(19,cur+d));show()}
function submitExam(){
var un=A.filter(function(a){return a<0}).length;
if(un&&!confirm(bn(un)+"টি প্রশ্নের উত্তর দেওয়া হয়নি। তবুও জমা দেবে?"))return;
clearInterval(iv);
var c=0,w=0,s=0,h="";
Q.forEach(function(q,i){
var a=A[i];if(a<0)s++;else if(a==q[2])c++;else w++;
h+='<div class="c"><div class="q"><span class="n">'+bn(i+1)+'</span><div>'+q[0]+'</div></div>';
q[1].forEach(function(o,j){
var cl="o",tg="";
if(j==q[2]){cl+=" ok";tg=j==a?" ✓ তোমার উত্তর (সঠিক)":" ✓ সঠিক উত্তর"}
else if(j==a){cl+=" no";tg=" ✗ তোমার উত্তর"}
h+='<div class="'+cl+'">'+L[j]+'. '+o+'<span class="tag">'+tg+'</span></div>'});
if(a<0)h+='<div style="color:var(--mu)">উত্তর দেওয়া হয়নি</div>';
h+='</div>'});
var m=c-0.25*w,ms=bn(m.toFixed(2).replace(/\.?0+$/,"")),k=m<0?"n":m<5?"a":m<10?"b":m<14?"c":m<18?"d":"e",l=M[k];
