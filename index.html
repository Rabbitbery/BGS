<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>জাতিসংঘ ও বাংলাদেশ – মডেল টেস্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#5f6677;--bd:#dde1ea;--pr:#2457d6;--ok:#157a3d;--okb:#e3f6ea;--no:#b3261e;--nob:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--bd:#323746;--pr:#6c93ff;--ok:#5bd68a;--okb:#16301f;--no:#ff8a80;--nob:#3a1d1b}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--bd:#323746;--pr:#6c93ff;--ok:#5bd68a;--okb:#16301f;--no:#ff8a80;--nob:#3a1d1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali",system-ui,sans-serif;line-height:1.6}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 4px}
.mu{color:var(--mu);font-size:.9rem}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.q{font-weight:600;margin-bottom:8px}
label{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label.s{border-color:var(--pr);box-shadow:inset 0 0 0 1px var(--pr)}
input[type=radio]{margin-top:7px}
button{font:inherit;font-weight:600;background:var(--pr);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;width:100%}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr);margin-top:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;justify-content:space-between;font-weight:600}
.big{font-size:2.2rem;font-weight:700;text-align:center;color:var(--pr)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px}
.st div{border:1px solid var(--bd);border-radius:8px;padding:8px}
.o{padding:8px 10px;border-radius:8px;margin:5px 0;border:1px solid var(--bd)}
.o.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.o.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.tag{font-size:.85rem;font-weight:600}
.hide{display:none}
.hero{background:linear-gradient(135deg,#2457d6,#7c4dff);color:#fff;border-radius:20px;padding:24px 18px;margin:8px 0 14px;box-shadow:0 6px 20px rgba(60,60,200,.25)}
.hero h1{font-size:1.45rem;margin:0 0 4px}
.hero .mu{color:#e6e9ff}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem}
.chip b{display:block;font-size:1.2rem}
.c{border-radius:16px;box-shadow:0 2px 10px rgba(20,30,60,.07)}
.q{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
label{border-radius:12px;padding:11px 12px;align-items:center;transition:background .15s}
label.s{background:color-mix(in srgb,var(--pr) 12%,transparent)}
input[type=radio]{display:none}
.lt{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600}
label.s .lt{background:var(--pr);border-color:var(--pr);color:#fff}
.pb{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;width:0;background:var(--pr);transition:width .25s}
#tm{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:0 12px}
button{border-radius:14px;padding:14px 18px;font-size:1rem;box-shadow:0 4px 12px rgba(36,87,214,.3)}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--pr) calc(var(--p)*1%),var(--bd) 0)}
.ring>div{width:124px;height:124px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.9rem;line-height:1.2}
.ring small{font-size:.8rem;color:var(--mu);font-weight:400}
.msg{text-align:center;font-weight:600;font-size:1.05rem}
.st .a b{color:var(--ok)}
.st .b b{color:var(--no)}
.sk{width:auto;padding:7px 14px;font-size:.88rem;box-shadow:none;margin-top:4px}
.msg{font-size:1.6rem}
</style>
</head>
<body>
<div class="w">
<div id="start">
<div class="hero"><h1>নবম অধ্যায়: জাতিসংঘ ও বাংলাদেশ</h1>
<div class="mu">বাংলাদেশ ও বিশ্বপরিচয় · মডেল টেস্ট</div>
<div class="chips"><div class="chip"><b>২০</b>প্রশ্ন</div><div class="chip"><b>+১</b>সঠিক উত্তর</div><div class="chip"><b>−০.২৫</b>ভুল উত্তর</div></div></div>
<p class="mu">জমা দেওয়ার পর সঠিক উত্তরমালা ও তোমার প্রাপ্ত নম্বর দেখতে পাবে।</p>
<button onclick="begin()">পরীক্ষা শুরু করো</button>
</div>
<div id="exam" class="hide">
<div class="bar" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><span id="prog">০/২০ উত্তর দেওয়া হয়েছে</span><span id="tm">০০:০০</span></div><div class="pb"><i id="pf"></i></div></div>
<div id="qs"></div>
<button onclick="submitExam()">জমা দাও</button>
</div>
<div id="res" class="hide"></div>
</div>
<script>
var Q=[
["জাতিসংঘ দিবস পালিত হয় কোন তারিখে?",["১০ জানুয়ারি","২৪ অক্টোবর","২৫ নভেম্বর","১০ ডিসেম্বর"],1],
["লীগ অব নেশনস প্রতিষ্ঠিত হয় কবে?",["১০ জানুয়ারি ১৯১৯","১০ জানুয়ারি ১৯৪৫","১০ জানুয়ারি ১৯২০","২৪ অক্টোবর ১৯২০"],2],
["জাতিসংঘের কোন অঙ্গকে ‘বিশ্বের সংসদ’ বলা হয়?",["নিরাপত্তা পরিষদ","অছি পরিষদ","সচিবালয়","সাধারণ পরিষদ"],3],
["‘ভেটো’ ক্ষমতা সম্পর্কে সঠিক তথ্য কোনটি?<br>i. এটি নিরাপত্তা পরিষদের স্থায়ী সদস্যদের আছে<br>ii. এর মাধ্যমে কোনো প্রস্তাব নাকচ করা যায়<br>iii. অস্থায়ী সদস্যরাও এটি প্রয়োগ করতে পারে",["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],0],
["অছি পরিষদ গঠনের উদ্দেশ্য কী ছিল?",["আন্তর্জাতিক বিরোধের আইনি নিষ্পত্তি","স্বাধীনতাপ্রাপ্ত নয় এমন এলাকার তত্ত্বাবধান","বিশ্বের অর্থনৈতিক উন্নয়ন","শরণার্থীদের পুনর্বাসন"],1],
["আন্তর্জাতিক বিচারালয়ে বিচারকের সংখ্যা কত?",["৯","১২","১৫","২১"],2],
["বাংলাদেশ জাতিসংঘের সদস্যপদ লাভ করে কোন তারিখে?",["২৪ অক্টোবর ১৯৪৫","২৬ মার্চ ১৯৭১","১৬ ডিসেম্বর ১৯৭১","১৭ সেপ্টেম্বর ১৯৭৪"],3],
["বাংলাদেশ প্রথম কোন দেশগুলোতে জাতিসংঘের শান্তিরক্ষা মিশনে অংশ নেয়?",["ইরাক ও নামিবিয়া","লেবানন ও মালি","সিয়েরা লিওন ও আইভরি কোস্ট","দক্ষিণ সুদান ও কঙ্গো"],0],
["১৯৮৮ থেকে ২০১৫ সাল পর্যন্ত বাংলাদেশ জাতিসংঘের কতটি শান্তি মিশনে অংশ নিয়েছে?",["৪৩","৬৩","১৬৮","৫১"],1],
["একটি আন্তর্জাতিক সংস্থা বাংলাদেশে নারীর অর্থনৈতিক ক্ষমতায়ন ও নারীর প্রতি সহিংসতা প্রতিরোধে কাজ করছে। সংস্থাটি কোনটি?",["UNICEF","UNFPA","UNIFEM","UNHCR"],2],
["UNDP বাংলাদেশে যেসব ক্ষেত্রে উল্লেখযোগ্য সফলতা অর্জন করেছে—<br>i. শিশু মৃত্যুহার হ্রাস<br>ii. দারিদ্র্য হার হ্রাসকরণ<br>iii. নারীর ক্ষমতায়ন",["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],3],
["সিডও (CEDAW) সনদ কার্যকর হওয়ার জন্য কতটি দেশের সমর্থন প্রয়োজন হয়েছিল?",["১০টি","২০টি","৩০টি","৫১টি"],1],
["জাতিসংঘ নির্ধারিত টেকসই উন্নয়ন অভীষ্টের (SDG) সংখ্যা কত?",["১২","১৫","১৭","২১"],2],
["ঘটনাগুলো কালানুক্রমে সাজাও:<br>i. সিডও সনদ গৃহীত হয়<br>ii. প্রথম বিশ্ব নারী সম্মেলন<br>iii. বেইজিং কর্মপরিকল্পনা গৃহীত হয়<br>iv. নারী উন্নয়ন দশক ঘোষণা",["ii, i, iv, iii","ii, iv, i, iii","iv, ii, i, iii","i, ii, iv, iii"],1],
["তৃতীয় বিশ্ব নারী সম্মেলন কোথায় অনুষ্ঠিত হয়?",["নাইরোবি","কোপেনহেগেন","মেক্সিকো সিটি","বেইজিং"],0],
["কোন সম্মেলনে নারীর অধিকারকে মানবাধিকার হিসেবে স্বীকৃতি দেওয়া হয়?",["রিও ডি জেনেরো","নাইরোবি","বেইজিং","ভিয়েনা"],3],
["১৯৯৯ সালে জাতিসংঘ সাধারণ পরিষদ কোন দিনটিকে ‘আন্তর্জাতিক নারী নির্যাতন প্রতিরোধ দিবস’ হিসেবে ঘোষণা করে?",["৮ মার্চ","২৫ নভেম্বর","১৭ নভেম্বর","১০ ডিসেম্বর"],1],
["আফ্রিকার দেশগুলোতে বাংলাদেশি শান্তিরক্ষীরা স্থানীয় মানুষের ভালোবাসা ও শ্রদ্ধা পেয়েছে। এর কারণ—<br>i. যুদ্ধরত গোষ্ঠীর মাঝে দক্ষতার সাথে অস্ত্রবিরতি পর্যবেক্ষণ<br>ii. আন্তরিক প্রশিক্ষণ ও সাহসী ভূমিকা<br>iii. জাতিসংঘে সর্বোচ্চ অর্থনৈতিক অবদান",["ii ও iii","i ও iii","i ও ii","i, ii ও iii"],2],
["সরকার কৃষকদের সার ও কীটনাশক সরবরাহ করে। অংশীদারিত্বের দৃষ্টিতে কৃষকের দায়িত্ব কোনটি?",["যত বেশি সম্ভব ব্যবহার করা","সব দায়িত্ব সরকারের ওপর ছেড়ে দেওয়া","শুধু নিজের লাভের কথা ভাবা","সচেতনভাবে পরিমিত ব্যবহার করা"],3],
["বাংলাদেশের টেকসই উন্নয়নের পথে চ্যালেঞ্জ কোনগুলো?<br>i. অপরিকল্পিত শিল্পায়ন ও নগরায়ণ<br>ii. প্রাকৃতিক বিপর্যয় মোকাবিলার প্রতিরোধমূলক ব্যবস্থার অভাব<br>iii. দারিদ্র্যের হার উল্লেখযোগ্যভাবে হ্রাস",["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],0]
];
var L=["ক","খ","গ","ঘ"],A=[],t0,iv;
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function $(i){return document.getElementById(i)}
function begin(){
A=Q.map(function(){return -1});
var h="";
Q.forEach(function(q,i){
h+='<div class="c"><div class="q"><span class="n">'+bn(i+1)+'</span><div>'+q[0]+'</div></div>';
q[1].forEach(function(o,j){h+='<label id="l'+i+'_'+j+'"><input type="radio" name="q'+i+'" onchange="pick('+i+','+j+')"><span class="lt">'+L[j]+'</span><span>'+o+'</span></label>'});
h+='</div>'});
$("qs").innerHTML=h;
$("start").className="c hide";$("exam").className="";$("res").className="hide";
window.scrollTo(0,0);prog();
t0=Date.now();clearInterval(iv);
iv=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);$("tm").textContent=bn(("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2))},1000);
}
function pick(i,j){
A[i]=j;
for(var k=0;k<4;k++)$("l"+i+"_"+k).className=k==j?"s":"";
prog();
}
function skip(i){A[i]=-1;for(var k=0;k<4;k++){var l=$("l"+i+"_"+k);l.className="";l.getElementsByTagName("input")[0].checked=false}prog();var n=document.querySelectorAll("#qs .c")[i+1];if(n)n.scrollIntoView({behavior:"smooth",block:"center"})}
function prog(){var n=A.filter(function(a){return a>=0}).length;$("prog").textContent=bn(n)+"/২০ উত্তর দেওয়া হয়েছে";$("pf").style.width=n*5+"%"}
function submitExam(){
var un=A.filter(function(a){return a<0}).length;
if(un&&!confirm(bn(un)+"টি প্রশ্নের উত্তর দেওয়া হয়নি। তবুও জমা দেবে?"))return;
clearInterval(iv);
var c=0,w=0,s=0,h="";
Q.forEach(function(q,i){
var a=A[i];
if(a<0)s++;else if(a==q[2])c++;else w++;
h+='<div class="c"><div class="q"><span class="n">'+bn(i+1)+'</span><div>'+q[0]+'</div></div>';
q[1].forEach(function(o,j){
var cl="o",tg="";
if(j==q[2]){cl+=" ok";tg=" ✓ সঠিক উত্তর"}
else if(j==a){cl+=" no";tg=" ✗ তোমার উত্তর"}
if(j==q[2]&&j==a)tg=" ✓ তোমার উত্তর (সঠিক)";
h+='<div class="'+cl+'">'+L[j]+'. '+o+'<span class="tag">'+tg+'</span></div>'});
if(a<0)h+='<div class="mu">উত্তর দেওয়া হয়নি</div>';
h+='</div>'});
var m=c-0.25*w;
var ms=bn(m.toFixed(2).replace(/\.?0+$/,""));
$("res").innerHTML='<div class="c"><div class="ring" style="--p:'+Math.max(0,m*5)+'"><div>'+ms+'<small>/ ২০</small></div></div><p class="msg">'+(m<10?"তুই গাধা 🫏🫏":m<18?"তুই গাধা 🫏":"চমৎকার! 🎉")+'</p><div class="st"><div class="a">সঠিক<br><b>'+bn(c)+'</b></div><div class="b">ভুল<br><b>'+bn(w)+'</b></div><div>বাদ<br><b>'+bn(s)+'</b></div></div><p class="mu" style="text-align:center">'+bn(c)+' × ১ − '+bn(w)+' × ০.২৫ = '+ms+'</p><button onclick="begin()">আবার পরীক্ষা দাও</button></div><h1>উত্তরমালা</h1>'+h;
$("exam").className="hide";$("res").className="";
window.scrollTo(0,0);
}
</script>
</body>
